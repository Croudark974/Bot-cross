<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bot Cross</title>
<style>
  :root { --bg:#000; --card:#0a0a0a; --line:#222; --txt:#fff; --muted:#8b8b8b;
          --green:#3fb950; --greenbg:#0f2a17; --orange:#d29922; --orangebg:#2d2208;
          --red:#f85149; --redbg:#2d0f0e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:16px 14px 40px; max-width:560px; margin:auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  h1 { font-size:22px; }
  .maj { color:var(--muted); font-size:13px; }
  .tri { display:flex; gap:8px; margin-bottom:16px; }
  .tri button { flex:1; background:#111; color:var(--muted); border:1px solid var(--line);
                border-radius:999px; padding:9px; font-size:14px; font-weight:600; }
  .tri button.on { background:#fff; color:#000; border-color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px;
          padding:20px; margin-bottom:14px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .top b { font-size:19px; display:flex; align-items:center; gap:7px; }
  .badge { font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .g { color:var(--green); background:var(--greenbg); }
  .o { color:var(--orange); background:var(--orangebg); }
  .r { color:var(--red); background:var(--redbg); }
  .titre { font-size:17px; font-weight:700; margin-top:14px; }
  .prix { font-size:38px; font-weight:800; margin:6px 0 2px; letter-spacing:-1px; }
  .sub { color:var(--muted); font-size:13px; }
  hr { border:none; border-top:1px solid var(--line); margin:14px 0; }
  ul { list-style:none; }
  li { display:flex; justify-content:space-between; font-size:15px; padding:5px 0; color:#ddd; }
  li span:last-child { font-weight:600; color:#fff; }
  .marge { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; }
  .marge span:first-child { font-weight:700; font-size:16px; }
  .marge span:last-child { font-size:28px; font-weight:800; }
  .btn { display:block; text-align:center; margin-top:14px; padding:12px; border-radius:14px;
         background:#ff6e14; color:#fff; font-weight:700; text-decoration:none; }
  .vide { color:var(--muted); text-align:center; margin-top:60px; }
</style>
</head>
<body>
<header><h1>🏍️ Bot Cross</h1><span class="maj" id="maj"></span></header>
<div class="tri">
  <button id="tMarge" class="on">Meilleure marge</button>
  <button id="tDate">Plus récentes</button>
</div>
<div id="liste"></div>

<script>
const DEMO = [
  {titre:"KTM 85 SX", annee:"2022", prix:2400, marche:3000, reparations:150, revente:2900, frais:100, marge:250, url:"#", date:"2026-11-18T12:30", demo:true},
  {titre:"Yamaha YZ 125", annee:"2019", prix:3100, marche:3900, reparations:120, revente:3780, frais:100, marge:460, url:"#", date:"2026-11-18T11:05", demo:true},
  {titre:"Honda CRF 250R", annee:"2016", prix:3500, marche:3600, reparations:350, revente:3490, frais:100, marge:-460, url:"#", date:"2026-11-18T09:40", demo:true},
];
let annonces = [], tri = "marge";
const eur = n => (n<0?"−":"") + Math.abs(n).toLocaleString("fr-FR") + " €";

function badge(m) {
  if (m >= 300) return ['g','Très bonne affaire'];
  if (m >= 100) return ['g','À étudier rapidement'];
  if (m >= 0)   return ['o','Marge faible'];
  return ['r','Pas rentable'];
}

function afficher() {
  const l = [...annonces].sort((a,b) => tri==="marge" ? b.marge-a.marge : b.date.localeCompare(a.date));
  document.getElementById("liste").innerHTML = l.length ? l.map(a => {
    const [c, txt] = badge(a.marge);
    const h = new Date(a.date).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    return `<div class="card">
      <div class="top"><b>🔔 Nouvelle opportunité</b><span class="badge ${c}">${txt}</span></div>
      <div class="titre">${a.titre}${a.annee && !a.titre.includes(a.annee) ? " – "+a.annee : ""}</div>
      <div class="prix">${eur(a.prix)}</div>
      <div class="sub">${a.demo ? "Annonce fictive – aperçu" : "Vue le " + h}</div>
      <hr>
      <ul>
        <li><span>Prix de marché estimé</span><span>${eur(a.marche)}</span></li>
        <li><span>Budget réparations estimé</span><span>${eur(a.reparations)}</span></li>
        <li><span>Revente estimée</span><span>${eur(a.revente)}</span></li>
        <li><span>Frais divers</span><span>${eur(a.frais)}</span></li>
      </ul>
      <div class="marge"><span>Marge potentielle</span>
        <span style="color:var(--${c==='g'?'green':c==='o'?'orange':'red'})">${a.marge>=0?"+":""}${eur(a.marge)}</span></div>
      ${a.demo ? "" : `<a class="btn" href="${a.url}">Voir sur Leboncoin</a>`}
    </div>`;
  }).join("") : '<p class="vide">Aucune annonce pour l’instant…</p>';
}

async function charger() {
  try {
    const r = await fetch("annonces.json?t=" + Date.now());
    if (!r.ok) throw 0;
    annonces = await r.json();
    document.getElementById("maj").textContent = "MAJ " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  } catch { annonces = DEMO; document.getElementById("maj").textContent = "Mode aperçu"; }
  afficher();
}

document.getElementById("tMarge").onclick = () => { tri="marge"; tMarge.classList.add("on"); tDate.classList.remove("on"); afficher(); };
document.getElementById("tDate").onclick  = () => { tri="date";  tDate.classList.add("on"); tMarge.classList.remove("on"); afficher(); };
charger();
setInterval(charger, 5 * 60 * 1000);
</script>
</body>
