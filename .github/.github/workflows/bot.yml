name: Bot LBC cross

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lbc requests
      - run: python3 bot_lbc_cross.py --once
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Sauvegarde
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          touch annonces_vues.json historique_prix.json annonces.json
          git add annonces_vues.json historique_prix.json annonces.json
          git diff --cached --quiet || git commit -m "maj annonces"
          git push
